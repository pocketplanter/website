<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pocket planter: this page wandered off</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preload" href="/fonts/PlayfairDisplay-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: 'Playfair Display'; font-style: italic; font-weight: 400 900; font-display: swap; src: url('/fonts/PlayfairDisplay-italic-latin.woff2') format('woff2'); }
    @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 300 700; font-display: swap; src: url('/fonts/DMSans-normal-latin.woff2') format('woff2'); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --lime: #c4d777; --plum: #4a2a3d; --cream: #f0f4d8; }
    body { min-height: 100vh; display: grid; place-items: center; background: var(--plum); color: var(--cream); font-family: 'DM Sans', system-ui, sans-serif; padding: 32px 24px; overflow: hidden; }
    .circle { position: fixed; border-radius: 50%; background: rgba(93,56,80,0.9); }
    .c1 { width: 60vw; height: 60vw; right: -20vw; top: -20vw; }
    .c2 { width: 40vw; height: 40vw; left: -15vw; bottom: -15vw; }
    main { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 48px; align-items: center; max-width: 880px; }
    img { width: clamp(160px, 28vw, 280px); }
    .num { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--lime); margin-bottom: 14px; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700; font-size: clamp(2.2rem, 6vw, 4rem); line-height: 1.05; margin-bottom: 18px; }
    p { font-size: 1.05rem; line-height: 1.6; opacity: 0.8; max-width: 38ch; margin-bottom: 28px; }
    a.btn { display: inline-block; background: var(--lime); color: var(--plum); font-weight: 600; text-decoration: none; padding: 14px 30px; border-radius: 100px; transition: transform 0.3s, box-shadow 0.3s; }
    a.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(196,215,119,0.4); }
    :focus-visible { outline: 3px solid #b76f9b; outline-offset: 3px; }
    @media (max-width: 640px) { main { grid-template-columns: 1fr; text-align: center; justify-items: center; gap: 24px; } p { margin-inline: auto; } }
    @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
  </style>
</head>
<body>
  <div class="circle c1" aria-hidden="true"></div>
  <div class="circle c2" aria-hidden="true"></div>
  <main>
    <img src="/surfando-novo.webp" alt="mochi, the mushroom mascot, surfing away" width="280" height="377">
    <div>
      <div class="num">404</div>
      <h1>this page wandered off.</h1>
      <p>Like a pothos reaching for the window, it went somewhere we did not plan. Everything that matters is back on the home page.</p>
      <a class="btn" href="/">back home &rarr;</a>
    </div>
  </main>
</body>
</html>
