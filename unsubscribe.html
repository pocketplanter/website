  <script>
    (function () {
      var loading = document.getElementById('state-loading');
      var ok = document.getElementById('state-ok');
      var fail = document.getElementById('state-fail');
      function show(el, title) {
        loading.hidden = true;
        loading.querySelector('h1').removeAttribute('id');
        el.hidden = false;
        document.title = title + ' | pocket planter';
        var h = el.querySelector('h1');
        h.id = 'title';
        document.getElementById('main').setAttribute('aria-labelledby', 'title');
      }
      function failed() { show(fail, 'link problem'); }

      var token = (new URLSearchParams(window.location.search).get('e') || '').trim();
      if (!token) { failed(); return; }

      fetch('https://shojtudruzyaddwjmeeb.supabase.co/functions/v1/unsubscribe', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer sb_publishable_RiAz4F9UKRiXKWvc39wR7Q_Mni5VkK7'
        },
        body: JSON.stringify({ token: token })
      }).then(function (response) {
        if (!response.ok) throw new Error('status ' + response.status);
        return response.json();
      }).then(function (data) {
        if (data && data.success) show(ok, 'unsubscribed');
        else failed();
      }).catch(function () { failed(); });
    })();
  </script>
